<!DOCTYPE html>
<html lang="es-CR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCS Tech Solutions — Admin de fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F0D; --panel:#121A16; --panel-2:#182019;
    --line: rgba(233,239,236,0.10); --line-strong: rgba(233,239,236,0.18);
    --text:#E9EFEC; --text-dim:#93A69C; --armed:#3B8EFF; --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1{font-family:'Space Grotesk', sans-serif; font-size:20px; margin-bottom:4px;}
  .wrap{max-width:640px; margin:0 auto; padding:32px 20px 60px;}
  p.sub{color:var(--text-dim); font-size:13px; margin-bottom:28px;}
  .gate{
    max-width:340px; margin:20vh auto 0; text-align:center;
  }
  .gate input{
    width:100%; margin-top:20px; padding:12px 14px; border-radius:var(--radius);
    background:var(--panel-2); border:1px solid var(--line-strong); color:var(--text);
    font-size:16px; text-align:center;
  }
  .gate button, .btn{
    margin-top:14px; width:100%; padding:12px; border-radius:var(--radius); border:none;
    background:var(--armed); color:#fff; font-weight:600; font-size:14px;
  }
  .gate .error{color:#FF6B5E; font-size:13px; margin-top:12px; display:none;}
  .card{
    display:flex; gap:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px; margin-bottom:12px; align-items:center;
  }
  .thumb{
    width:84px; height:60px; flex:none; background:var(--panel-2); border-radius:var(--radius);
    border:1px solid var(--line); overflow:hidden; display:flex; align-items:center; justify-content:center;
  }
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .thumb span{color:var(--text-dim); font-size:10px; text-align:center;}
  .info{flex:1; min-width:0;}
  .name{font-size:14px; font-weight:600; margin-bottom:2px;}
  .cat{font-size:11px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; text-transform:uppercase;}
  .upload-label{
    display:inline-block; margin-top:8px; font-size:12px; padding:7px 12px;
    border:1px solid var(--line-strong); border-radius:var(--radius); color:var(--text);
  }
  .status{font-size:11px; margin-top:6px; font-family:'IBM Plex Mono',monospace;}
  .status.ok{color:#3BD16F;}
  .status.err{color:#FF6B5E;}
  input[type=file]{display:none;}
  h2{font-family:'Space Grotesk', sans-serif; font-size:15px; margin:36px 0 4px;}
  .new-form{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-top:14px; display:flex; flex-direction:column; gap:10px;
  }
  .new-form label{font-size:12px; color:var(--text-dim);}
  .new-form input, .new-form select{
    width:100%; padding:10px 12px; border-radius:var(--radius); background:var(--panel-2);
    border:1px solid var(--line-strong); color:var(--text); font-size:14px; font-family:inherit;
  }
  .new-form input[type=file]{display:block; padding:8px; font-size:12px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .del-btn{
    font-size:11px; color:#FF6B5E; border:1px solid rgba(255,107,94,.4);
    border-radius:var(--radius); padding:5px 10px; background:none;
  }
  .edit-btn, .cancel-btn{
    font-size:11px; color:var(--text); border:1px solid var(--line-strong);
    border-radius:var(--radius); padding:5px 10px; background:none;
  }
  .actions{margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;}
  .edit-form{
    background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; margin:-2px 0 12px; display:flex; flex-direction:column; gap:8px;
  }
  .edit-form input, .edit-form select{
    width:100%; padding:9px 10px; border-radius:var(--radius); background:var(--bg);
    border:1px solid var(--line-strong); color:var(--text); font-size:13px; font-family:inherit;
  }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>JCS Tech Solutions</h1>
  <p class="sub">Panel de fotos del catálogo</p>
  <input type="password" id="pass" placeholder="Clave" inputmode="text" autocomplete="off">
  <button id="enter" class="btn">Entrar</button>
  <div class="error" id="gateError">Clave incorrecta.</div>
</div>

<div class="wrap" id="panel" style="display:none;">
  <h1>Catálogo</h1>
  <p class="sub">Agregá productos nuevos y subí sus fotos desde el celular.</p>

  <h2>Agregar producto nuevo</h2>
  <div class="new-form">
    <div class="field">
      <label for="new-name">Nombre</label>
      <input id="new-name" placeholder="Ej. Domo 4K WiFi">
    </div>
    <div class="field">
      <label for="new-cat">Categoría</label>
      <select id="new-cat">
        <option value="interior">Interior</option>
        <option value="exterior">Exterior</option>
        <option value="wifi">WiFi</option>
        <option value="ptz">PTZ</option>
        <option value="kit">Kits</option>
      </select>
    </div>
    <div class="field">
      <label for="new-price">Precio (₡)</label>
      <input id="new-price" type="number" inputmode="numeric" placeholder="Ej. 45000">
    </div>
    <div class="field">
      <label for="new-specs">Características (separadas por coma)</label>
      <input id="new-specs" placeholder="Ej. 4K, IP67, Nocturna 30m">
    </div>
    <div class="field">
      <label for="new-photo">Foto (opcional, se puede subir después)</label>
      <input id="new-photo" type="file" accept="image/*" capture="environment">
    </div>
    <button id="add-product" class="btn">Agregar producto</button>
    <div class="status" id="add-status"></div>
  </div>

  <h2>Productos y fotos</h2>
  <p class="sub" style="margin-bottom:12px;">Tocá "Subir foto" en cada producto para tomarla con la cámara o elegirla de la galería.</p>
  <div id="list"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDKxgTwdSmtSTfAKUv9lce4AoqQNUPSiY8",
    authDomain: "jcs-tech-solutions.firebaseapp.com",
    projectId: "jcs-tech-solutions",
    storageBucket: "jcs-tech-solutions.firebasestorage.app",
    messagingSenderId: "164555495929",
    appId: "1:164555495929:web:8dae61ce6bce7ae3e80528",
    measurementId: "G-KVGJ7GKZG5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Firestore admite hasta 1MB por documento — las fotos se redimensionan y
  // comprimen en el celular antes de guardarlas como data URL, sin necesitar
  // Firebase Storage (que exige plan de pago) ni un servicio externo.
  const MAX_DIMENSION = 1000;
  const MAX_BYTES = 700000;

  function loadImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function compressImage(file){
    const img = await loadImage(file);
    const scale = Math.min(1, MAX_DIMENSION / Math.max(img.width, img.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    let quality = 0.75;
    let dataUrl = canvas.toDataURL("image/jpeg", quality);
    while (dataUrl.length > MAX_BYTES * 1.37 && quality > 0.3){
      quality -= 0.15;
      dataUrl = canvas.toDataURL("image/jpeg", quality);
    }
    return dataUrl;
  }

  // Clave compartida del panel. SHA-256 en hex — cambiala pidiéndole a Claude
  // que actualice PASS_HASH con el hash de la nueva clave.
  const PASS_HASH = "5d12edcede391d4daf7e12b6aec8bd3653bfb56c12308dacd1356cda2bfd4318";

  async function sha256Hex(text){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const BASE_PRODUCTS = [
    {id:1, name:"Domo Interior 2MP", cat:"interior", price:28500, specs:["1080p","Visión nocturna 20m","Audio"]},
    {id:2, name:"Bala Exterior 4MP", cat:"exterior", price:42000, specs:["4MP","IP67","Nocturna 30m"]},
    {id:3, name:"Cámara WiFi Pan-Tilt", cat:"wifi", price:32900, specs:["1080p","App móvil","Sigue movimiento"]},
    {id:4, name:"PTZ 4K Zoom 20x", cat:"ptz", price:185000, specs:["4K","Zoom óptico 20x","Auto-tracking"]},
    {id:5, name:"Domo Antivandálico 4MP", cat:"exterior", price:52500, specs:["4MP","Anti-golpes","IP66"]},
    {id:6, name:"WiFi Exterior Solar", cat:"wifi", price:64000, specs:["Panel solar","Batería 30 días","1080p"]},
    {id:7, name:"Bala WiFi Exterior 2K", cat:"exterior", price:45900, specs:["2K","WiFi","Nocturna a color"]},
    {id:8, name:"Kit 4 Cámaras + DVR 1TB", cat:"kit", price:215000, specs:["4 cámaras","DVR 1TB","Cableado incl."]},
    {id:9, name:"Kit 8 Cámaras + NVR 2TB", cat:"kit", price:398000, specs:["8 cámaras","NVR 2TB","IP exterior"]},
  ];
  const BASE_IDS = new Set(BASE_PRODUCTS.map(p => p.id));
  const CATS = ["interior","exterior","wifi","ptz","kit"];

  const listEl = document.getElementById("list");
  let overrides = {};
  let customProducts = [];
  const editingIds = new Set();

  function allProducts(){
    const base = BASE_PRODUCTS.map(p => {
      const o = overrides[p.id] || {};
      return {
        id: p.id, isBase: true,
        name: o.nombre || p.name,
        cat: o.categoria || p.cat,
        price: o.precio != null ? o.precio : p.price,
        specs: (o.specs && o.specs.length) ? o.specs : p.specs,
        imagen: o.imagen,
      };
    });
    return [...base, ...customProducts.map(p => ({ ...p, isBase:false }))];
  }

  function nextId(){
    const ids = allProducts().map(p => p.id);
    return Math.max(9, ...ids) + 1;
  }

  const crc = n => "₡" + Number(n || 0).toLocaleString("es-CR");

  function render(){
    listEl.innerHTML = "";
    allProducts().forEach(p => {
      const wrap = document.createElement("div");
      const editing = editingIds.has(p.id);
      wrap.innerHTML = `
        <div class="card">
          <div class="thumb">${p.imagen ? `<img src="${p.imagen}" alt="">` : `<span>Sin foto</span>`}</div>
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="cat">${p.cat} · ${crc(p.price)}</div>
            <label class="upload-label" for="file-${p.id}">📷 Subir foto</label>
            <input type="file" id="file-${p.id}" accept="image/*" capture="environment">
            <div class="status" id="status-${p.id}"></div>
            <div class="actions">
              <button class="edit-btn" data-id="${p.id}">${editing ? "Cerrar" : "✏️ Editar"}</button>
              ${!p.isBase ? `<button class="del-btn" data-id="${p.id}">🗑 Eliminar producto</button>` : ""}
            </div>
          </div>
        </div>
        ${editing ? `
        <div class="edit-form" data-id="${p.id}">
          <div class="field"><label>Nombre</label><input class="e-name" value="${p.name.replace(/"/g,"&quot;")}"></div>
          <div class="field"><label>Categoría</label>
            <select class="e-cat">
              ${CATS.map(c => `<option value="${c}" ${c===p.cat?"selected":""}>${c}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label>Precio (₡)</label><input class="e-price" type="number" value="${p.price}"></div>
          <div class="field"><label>Características (separadas por coma)</label><input class="e-specs" value="${(p.specs||[]).join(", ").replace(/"/g,"&quot;")}"></div>
          <div class="actions">
            <button class="btn save-btn" data-id="${p.id}" style="margin:0;">Guardar cambios</button>
            <button class="cancel-btn" data-id="${p.id}">Cancelar</button>
          </div>
        </div>` : ""}`;
      listEl.appendChild(wrap);

      wrap.querySelector(`#file-${p.id}`).addEventListener("change", (e) => handleUpload(p.id, e.target.files[0]));
      wrap.querySelector(".edit-btn").addEventListener("click", () => {
        if (editingIds.has(p.id)) editingIds.delete(p.id); else editingIds.add(p.id);
        render();
      });
      const delBtn = wrap.querySelector(".del-btn");
      if (delBtn) delBtn.addEventListener("click", () => handleDelete(p.id, p.name));
      const saveBtn = wrap.querySelector(".save-btn");
      if (saveBtn) saveBtn.addEventListener("click", () => handleSaveEdit(p.id, wrap));
      const cancelBtn = wrap.querySelector(".cancel-btn");
      if (cancelBtn) cancelBtn.addEventListener("click", () => { editingIds.delete(p.id); render(); });
    });
  }

  async function handleSaveEdit(id, wrap){
    const name = wrap.querySelector(".e-name").value.trim();
    const cat = wrap.querySelector(".e-cat").value;
    const price = Number(wrap.querySelector(".e-price").value);
    const specs = wrap.querySelector(".e-specs").value.split(",").map(s => s.trim()).filter(Boolean);
    if(!name || !price){
      alert("Falta el nombre o el precio.");
      return;
    }
    try{
      await setDoc(doc(db, "productos", String(id)), {
        nombre: name, categoria: cat, precio: price, specs, actualizado: serverTimestamp()
      }, { merge: true });
      editingIds.delete(id);
    }catch(err){
      console.error(err);
      alert("No se pudo guardar. Probá de nuevo.");
    }
  }

  async function handleUpload(id, file){
    if(!file) return;
    const statusEl = document.getElementById(`status-${id}`);
    statusEl.textContent = "Subiendo...";
    statusEl.className = "status";
    try{
      const dataUrl = await compressImage(file);
      await setDoc(doc(db, "productos", String(id)), { imagen: dataUrl, actualizado: serverTimestamp() }, { merge: true });
      statusEl.textContent = "✓ Listo";
      statusEl.className = "status ok";
    }catch(err){
      console.error(err);
      statusEl.textContent = "Error al subir. Probá de nuevo.";
      statusEl.className = "status err";
    }
  }

  async function handleDelete(id, name){
    if(!confirm(`¿Eliminar "${name}" del catálogo?`)) return;
    try{
      await deleteDoc(doc(db, "productos", String(id)));
    }catch(err){
      console.error(err);
      alert("No se pudo eliminar. Probá de nuevo.");
    }
  }

  document.getElementById("add-product").addEventListener("click", async () => {
    const statusEl = document.getElementById("add-status");
    const name = document.getElementById("new-name").value.trim();
    const cat = document.getElementById("new-cat").value;
    const price = Number(document.getElementById("new-price").value);
    const specs = document.getElementById("new-specs").value.split(",").map(s => s.trim()).filter(Boolean);
    const file = document.getElementById("new-photo").files[0];

    if(!name || !price){
      statusEl.textContent = "Falta el nombre o el precio.";
      statusEl.className = "status err";
      return;
    }

    statusEl.textContent = "Guardando...";
    statusEl.className = "status";
    try{
      const imagen = file ? await compressImage(file) : null;
      const id = nextId();
      await setDoc(doc(db, "productos", String(id)), {
        custom: true, nombre: name, categoria: cat, precio: price, specs, imagen,
        creado: serverTimestamp()
      });
      statusEl.textContent = "✓ Producto agregado";
      statusEl.className = "status ok";
      document.getElementById("new-name").value = "";
      document.getElementById("new-price").value = "";
      document.getElementById("new-specs").value = "";
      document.getElementById("new-photo").value = "";
    }catch(err){
      console.error(err);
      statusEl.textContent = "Error al guardar. Probá de nuevo.";
      statusEl.className = "status err";
    }
  });

  onSnapshot(collection(db, "productos"), (snap) => {
    const newOverrides = {};
    const newCustom = [];
    snap.forEach(d => {
      const data = d.data();
      const id = Number(d.id);
      if(BASE_IDS.has(id)){
        newOverrides[id] = data;
      } else if(data.nombre){
        newCustom.push({ id, name: data.nombre, cat: data.categoria, price: data.precio, specs: data.specs || [], imagen: data.imagen });
      }
    });
    overrides = newOverrides;
    customProducts = newCustom;
    render();
  });

  document.getElementById("enter").addEventListener("click", async () => {
    const val = document.getElementById("pass").value;
    const hash = await sha256Hex(val);
    if(hash === PASS_HASH){
      try{ await signInAnonymously(auth); }catch(err){ console.error(err); }
      document.getElementById("gate").style.display = "none";
      document.getElementById("panel").style.display = "block";
      render();
    } else {
      document.getElementById("gateError").style.display = "block";
    }
  });
  document.getElementById("pass").addEventListener("keydown", (e) => {
    if(e.key === "Enter") document.getElementById("enter").click();
  });
</script>
</body>
</html>
